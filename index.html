<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ISTAL - Room Chat Realtime</title>

    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-dark-green: #0d2014;
            --card-bg: #152d1d;
            --accent-gold: #ffd700;
            --text-light: #e8f0eb;
            --text-muted: #8ca393;
            --chat-bubble-bg: #1c3b27;
            --chat-bubble-admin: #1a422a;
            --danger-red: #ff4d4d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg-dark-green);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-app {
            width: 100%;
            max-width: 480px;
            height: 100%;
            height: 100dvh; /* Menggunakan dvh agar pas di layar HP dan input tidak terpotong */
            display: flex;
            flex-direction: column;
            background: var(--card-bg);
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        @media (min-width: 500px) {
            .chat-app {
                height: 90vh;
                border-radius: 16px;
            }
        }

        /* Header */
        .chat-header {
            padding: 14px 16px;
            background: #09170e;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            flex-shrink: 0;
        }

        .chat-header-info h2 {
            font-size: 1.1rem;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chat-header-info span {
            font-size: 0.75rem;
            color: #4cd964;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #4cd964;
            border-radius: 50%;
            display: inline-block;
        }

        .user-tag {
            font-size: 0.8rem;
            background: rgba(255,255,255,0.1);
            padding: 4px 10px;
            border-radius: 12px;
            cursor: pointer;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Chat Body */
        .chat-box {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .chat-item {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .chat-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #2a4d35;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .chat-content-wrapper {
            max-width: 80%;
            width: 100%;
        }

        .chat-text-bg {
            background: var(--chat-bubble-bg);
            padding: 10px 14px;
            border-radius: 4px 14px 14px 14px;
            font-size: 0.9rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .chat-username {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--accent-gold);
            margin-bottom: 3px;
            display: flex;
            align-items: center;
        }

        .chat-meta {
            font-size: 0.68rem;
            color: var(--text-muted);
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
        }

        /* Tombol Hapus Pesan (Admin Only) */
        .btn-delete {
            background: none;
            border: none;
            color: var(--danger-red);
            cursor: pointer;
            font-size: 0.75rem;
            opacity: 0.8;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .btn-delete:hover {
            opacity: 1;
            background: rgba(255, 77, 77, 0.15);
        }

        /* Input Bar (Terkunci di Bawah) */
        .chat-input-area {
            padding: 12px 14px;
            background: #09170e;
            display: flex;
            gap: 8px;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.08);
            flex-shrink: 0;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.15);
            background: #13271a;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .chat-input-area input:focus {
            border-color: var(--accent-gold);
        }

        .chat-input-area button {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: var(--accent-gold);
            color: #0d2014;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.1s ease;
        }

        .chat-input-area button:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body>

<div class="chat-app">
    <!-- Header -->
    <div class="chat-header">
        <div class="chat-header-info">
            <h2><i class="fa-solid fa-comments" style="color: var(--accent-gold);"></i> Roomchat ISTAL</h2>
            <span><i class="status-dot"></i> Online (Realtime)</span>
        </div>
        <div class="user-tag" onclick="changeUsername()" title="Klik untuk ganti nama">
            <i class="fa-solid fa-user"></i> <span id="displayUsername">Anonim</span>
        </div>
    </div>

    <!-- Chat Box -->
    <div class="chat-box" id="chatBox">
        <div style="text-align: center; color: var(--text-muted); padding: 40px 10px; font-size: 0.85rem;">
            <i class="fa-solid fa-spinner fa-spin" style="font-size: 1.5rem; margin-bottom: 8px;"></i><br>
            Menghubungkan ke server...
        </div>
    </div>

    <!-- Input Bar -->
    <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="Ketik pesan silaturahmi..." autocomplete="off">
        <button id="sendBtn" onclick="sendChatMessage()">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>
</div>

<script>
    // 1. Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyChUPdkwJx8yGsOCofb8iTtVWaxysRB7mc",
        authDomain: "istalapp-8325d.firebaseapp.com",
        databaseURL: "https://istalapp-8325d-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "istalapp-8325d",
        storageBucket: "istalapp-8325d.firebasestorage.app",
        messagingSenderId: "167010805275",
        appId: "1:167010805275:web:b0bc9ab21edcf5dbee7abe"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const chatRef = database.ref('chats');

    const ADMIN_USERNAME = 'suturist4l';

    // 2. Local Storage User Management
    let currentUser = localStorage.getItem('CURRENT_USER');
    if (!currentUser) {
        currentUser = prompt("Masukkan Username Anda:") || "User_" + Math.floor(Math.random() * 1000);
        localStorage.setItem('CURRENT_USER', currentUser);
    }
    document.getElementById('displayUsername').innerText = currentUser;

    function changeUsername() {
        const newName = prompt("Masukkan Username baru:", currentUser);
        if (newName && newName.trim() !== "") {
            currentUser = newName.trim();
            localStorage.setItem('CURRENT_USER', currentUser);
            document.getElementById('displayUsername').innerText = currentUser;
            location.reload();
        }
    }

    // Anti XSS
    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // 3. Kirim Pesan
    function sendChatMessage() {
        const inputEl = document.getElementById('chatInput');
        const text = inputEl.value.trim();
        if (!text) return;

        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const dateStr = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });

        chatRef.push({
            username: currentUser,
            text: text,
            time: timeStr,
            date: dateStr,
            timestamp: firebase.database.ServerValue.TIMESTAMP
        }).then(() => {
            inputEl.value = '';
        }).catch((err) => {
            alert('Gagal mengirim: ' + err.message);
        });
    }

    // 4. Hapus Pesan (Khusus Admin suturist4l)
    function deleteChatMessage(key) {
        if (!key) return;
        if (confirm("Yakin ingin menghapus pesan ini?")) {
            chatRef.child(key).remove().catch((err) => {
                alert("Gagal menghapus: " + err.message);
            });
        }
    }

    // Enter Key Listener
    document.getElementById('chatInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') sendChatMessage();
    });

    // 5. Realtime Database Listener
    chatRef.on('value', (snapshot) => {
        const chatBox = document.getElementById('chatBox');
        const data = snapshot.val();

        if (!data) {
            chatBox.innerHTML = `
                <div style="text-align: center; color: var(--text-muted); padding: 40px 10px; font-size: 0.85rem;">
                    <i class="fa-solid fa-comments" style="font-size: 2rem; margin-bottom: 8px; opacity: 0.3;"></i><br>
                    Belum ada pesan silaturahmi.
                </div>
            `;
            return;
        }

        let htmlContent = '';
        const isCurrentAdmin = (currentUser.toLowerCase() === ADMIN_USERNAME.toLowerCase());

        Object.keys(data).forEach(key => {
            const chat = data[key];
            const username = chat.username || 'Anonim';
            const initial = username.charAt(0).toUpperCase();
            const timeInfo = chat.time || '';
            const dateInfo = chat.date || '';
            const safeText = escapeHtml(chat.text || '');

            const isMsgFromAdmin = (username.toLowerCase() === ADMIN_USERNAME.toLowerCase());
            
            // Centang biru untuk pesan dari admin
            const verifiedBadge = isMsgFromAdmin 
                ? `<i class="fa-solid fa-circle-check" style="color: #1DA1F2; margin-left: 4px; font-size: 0.82rem;" title="Terverifikasi Admin"></i>` 
                : '';

            const avatarStyle = isMsgFromAdmin ? 'style="background: var(--accent-gold); color: #0d2014;"' : '';
            const bubbleStyle = isMsgFromAdmin ? 'style="background: var(--chat-bubble-admin); border: 1px solid rgba(255,215,0,0.2);"' : '';

            // Tombol hapus HANYA dirender jika pengguna login sebagai suturist4l
            const deleteBtn = isCurrentAdmin 
                ? `<button class="btn-delete" onclick="deleteChatMessage('${key}')" title="Hapus pesan"><i class="fa-solid fa-trash"></i> Hapus</button>` 
                : '';

            htmlContent += `
                <div class="chat-item">
                    <div class="chat-avatar" ${avatarStyle}>${initial}</div>
                    <div class="chat-content-wrapper">
                        <div class="chat-text-bg" ${bubbleStyle}>
                            <div class="chat-username">${escapeHtml(username)}${verifiedBadge}</div>
                            <div>${safeText}</div>
                        </div>
                        <div class="chat-meta">
                            <span><i class="fa-regular fa-clock"></i> ${timeInfo} ${dateInfo ? '• ' + dateInfo : ''}</span>
                            ${deleteBtn}
                        </div>
                    </div>
                </div>
            `;
        });

        chatBox.innerHTML = htmlContent;
        chatBox.scrollTop = chatBox.scrollHeight;
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ISTAL - Ngaji Keliling Antar Pemuda</title>

    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --primary-green: #0d331a;
            --accent-green: #144d28;
            --bg-light: #f4f6f5;
            --card-bg: #ffffff;
            --text-dark: #1f2937;
            --text-muted: #6b7280;
            --danger-red: #e74c3c;
            --chat-bubble-bg: #f0f4f1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #121212;
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-wrapper {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
        }

        /* Banner Atas */
        .banner-container {
            padding: 12px 16px 6px 16px;
            background: #000;
        }

        .banner-card {
            position: relative;
            width: 100%;
            height: 150px;
            border-radius: 16px;
            overflow: hidden;
            background: #111;
        }

        .banner-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
        }

        .banner-text {
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;
            text-align: center;
            color: #fff;
            font-weight: 700;
            font-size: 1.05rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }

        /* Navigasi Grid Menu (4 Tombol Putih) */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 12px 16px;
            position: relative;
            z-index: 10; /* Agar selalu bisa diklik */
        }

        .menu-item {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 12px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            cursor: pointer;
            border: 1px solid #e5e7eb;
            user-select: none;
            transition: transform 0.1s ease, background 0.2s;
        }

        .menu-item:active {
            transform: scale(0.92);
            background-color: #f0f0f0;
        }

        .menu-item i {
            font-size: 1.3rem;
            color: var(--primary-green);
            pointer-events: none;
        }

        .menu-item span {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-dark);
            text-align: center;
            line-height: 1.1;
            pointer-events: none;
        }

        /* Kartu Utama Chat */
        .chat-section {
            flex: 1;
            background: var(--card-bg);
            margin-top: 4px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            border: 1px solid #e5e7eb;
            border-bottom: none;
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
            margin-bottom: 10px;
        }

        .chat-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-title i {
            font-size: 1.4rem;
            color: var(--primary-green);
        }

        .chat-title h3 {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--primary-green);
            line-height: 1.2;
        }

        .btn-reset-chat {
            background-color: var(--danger-red);
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 6px;
        }

        .user-status-bar {
            margin-bottom: 8px;
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-status-bar span b {
            color: var(--primary-green);
            cursor: pointer;
            text-decoration: underline;
        }

        /* Container Pesan Chat */
        .chat-box {
            flex: 1;
            min-height: 260px;
            max-height: 380px;
            overflow-y: auto;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #fafafa;
        }

        .chat-bubble-item {
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--primary-green);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .bubble-content {
            background-color: var(--chat-bubble-bg);
            padding: 8px 12px;
            border-radius: 12px;
            display: inline-block;
            max-width: 88%;
        }

        .bubble-username {
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--primary-green);
            margin-bottom: 2px;
        }

        .bubble-text {
            font-size: 0.88rem;
            color: #2c3e50;
            word-break: break-word;
            line-height: 1.3;
        }

        .bubble-meta {
            font-size: 0.68rem;
            color: var(--text-muted);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-delete-msg {
            color: var(--danger-red);
            cursor: pointer;
            border: none;
            background: none;
            font-size: 0.72rem;
            font-weight: 700;
        }

        /* Area Input Chat */
        .chat-input-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            align-items: center;
        }

        .chat-input-row input {
            flex: 1;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
            outline: none;
            font-size: 0.88rem;
            background: #fff;
        }

        .chat-input-row input:focus {
            border-color: var(--primary-green);
        }

        .btn-send {
            background-color: var(--primary-green);
            color: #fff;
            border: none;
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        /* MODAL POPUP LOGIN & MENU */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 20px;
        }

        .modal-card {
            background: #fff;
            width: 100%;
            max-width: 360px;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        .modal-card h4 {
            color: var(--primary-green);
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .modal-card p {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .modal-card input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 14px;
            font-size: 0.9rem;
            outline: none;
        }

        .modal-card button {
            width: 100%;
            padding: 12px;
            background: var(--primary-green);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="app-wrapper">

    <!-- 1. Banner Atas -->
    <div class="banner-container">
        <div class="banner-card">
            <img src="https://images.unsplash.com/photo-1542810634-71277d95dcbb?auto=format&fit=crop&w=800&q=80" alt="Ngaji Keliling">
            <div class="banner-text">Ngaji Keliling Antar Pemuda</div>
        </div>
    </div>

    <!-- 2. Grid Menu 4 Tombol Putih -->
    <div class="menu-grid">
        <div class="menu-item" onclick="openMenuInfo('Video')">
            <i class="fa-solid fa-circle-play"></i>
            <span>Video</span>
        </div>
        <div class="menu-item" onclick="openMenuInfo('Gallery')">
            <i class="fa-solid fa-image"></i>
            <span>Gallery</span>
        </div>
        <div class="menu-item" onclick="openMenuInfo('Sodaqoh')">
            <i class="fa-solid fa-qrcode"></i>
            <span>Sodaqoh</span>
        </div>
        <div class="menu-item" onclick="openMenuInfo('Surat Kegiatan')">
            <i class="fa-solid fa-scroll"></i>
            <span>Surat<br>Kegiatan</span>
        </div>
    </div>

    <!-- 3. Section Chat Realtime -->
    <div class="chat-section">
        <div class="chat-header">
            <div class="chat-title">
                <i class="fa-solid fa-comments"></i>
                <h3>Ruang Sapa &<br>Silaturahmi</h3>
            </div>
            <button class="btn-reset-chat" id="btnResetChat" onclick="resetAllChats()">
                <i class="fa-solid fa-trash-can"></i> Reset Chat
            </button>
        </div>

        <div class="user-status-bar">
            <span>Login sebagai: <b id="displayUsername" onclick="openLoginModal()">Belum Login</b></span>
            <span><i class="fa-solid fa-circle" style="color: #2ecc71; font-size: 0.6rem;"></i> Realtime</span>
        </div>

        <!-- Box Chat -->
        <div class="chat-box" id="chatBox">
            <div style="text-align: center; color: var(--text-muted); padding: 30px; font-size: 0.85rem;">
                Memuat pesan...
            </div>
        </div>

        <!-- Input Chat -->
        <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="Tulis pesan sapaan Anda..." autocomplete="off">
            <button class="btn-send" onclick="sendChatMessage()">
                <i class="fa-solid fa-paper-plane"></i> Kirim
            </button>
        </div>
    </div>

</div>

<!-- POPUP MODAL LOGIN -->
<div class="modal-overlay" id="loginModal">
    <div class="modal-card">
        <i class="fa-solid fa-user-circle" style="font-size: 2.5rem; color: var(--primary-green); margin-bottom: 8px;"></i>
        <h4>Masuk / Buat Akun</h4>
        <p>Masukkan nama panggilan Anda untuk mulai bersilaturahmi</p>
        <input type="text" id="modalUsernameInput" placeholder="Contoh: istalalbarokah" autocomplete="off">
        <button onclick="saveUserFromModal()">Simpan & Masuk</button>
    </div>
</div>

<!-- POPUP MODAL INFO MENU -->
<div class="modal-overlay" id="infoModal">
    <div class="modal-card">
        <i class="fa-solid fa-circle-info" style="font-size: 2.5rem; color: var(--primary-green); margin-bottom: 8px;"></i>
        <h4 id="infoTitle">Informasi</h4>
        <p id="infoBody">Fitur ini belum tersedia.</p>
        <button onclick="closeInfoModal()">Tutup</button>
    </div>
</div>

<script>
    // 1. Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyChUPdkwJx8yGsOCofb8iTtVWaxysRB7mc",
        authDomain: "istalapp-8325d.firebaseapp.com",
        databaseURL: "https://istalapp-8325d-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "istalapp-8325d",
        storageBucket: "istalapp-8325d.firebasestorage.app",
        messagingSenderId: "167010805275",
        appId: "1:167010805275:web:b0bc9ab21edcf5dbee7abe"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const chatRef = database.ref('chats');
    const usersRef = database.ref('users');

    const ADMIN_USERNAME = 'suturist4l';
    let currentUser = '';

    // 2. Sistem Login via Modal (Bebas Bug Prompt)
    function initApp() {
        currentUser = localStorage.getItem('CURRENT_USER');
        if (!currentUser) {
            openLoginModal();
        } else {
            updateUserUI();
        }
    }

    function openLoginModal() {
        document.getElementById('loginModal').style.display = 'flex';
        document.getElementById('modalUsernameInput').value = currentUser || '';
    }

    function saveUserFromModal() {
        const inputVal = document.getElementById('modalUsernameInput').value.trim();
        if (!inputVal) {
            alert("Harap isi username terlebih dahulu!");
            return;
        }

        currentUser = inputVal;
        localStorage.setItem('CURRENT_USER', currentUser);
        document.getElementById('loginModal').style.display = 'none';

        // Simpan ke Firebase Users
        const cleanUserKey = currentUser.replace(/[.#$/[\]]/g, "_");
        usersRef.child(cleanUserKey).set({
            username: currentUser,
            lastLogin: firebase.database.ServerValue.TIMESTAMP
        });

        updateUserUI();
    }

    function updateUserUI() {
        document.getElementById('displayUsername').innerText = currentUser;
        const isCurrentAdmin = (currentUser.toLowerCase() === ADMIN_USERNAME.toLowerCase());
        document.getElementById('btnResetChat').style.display = isCurrentAdmin ? 'flex' : 'none';
    }

    // Modal Info untuk Tombol Grid
    function openMenuInfo(menuName) {
        document.getElementById('infoTitle').innerText = menuName;
        document.getElementById('infoBody').innerText = "Fitur " + menuName + " sedang dalam pengembangan.";
        document.getElementById('infoModal').style.display = 'flex';
    }

    function closeInfoModal() {
        document.getElementById('infoModal').style.display = 'none';
    }

    // Helper Anti XSS
    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // 3. Fitur Chat Realtime
    function sendChatMessage() {
        if (!currentUser) {
            openLoginModal();
            return;
        }

        const inputEl = document.getElementById('chatInput');
        const text = inputEl.value.trim();
        if (!text) return;

        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const dateStr = now.toLocaleDateString('id-ID', { day: '2-digit', month: '2-digit', year: 'numeric' });

        chatRef.push({
            username: currentUser,
            text: text,
            time: timeStr,
            date: dateStr,
            timestamp: firebase.database.ServerValue.TIMESTAMP
        }).then(() => {
            inputEl.value = '';
        }).catch((err) => {
            alert('Gagal mengirim: ' + err.message);
        });
    }

    function deleteChatMessage(key) {
        if (!key) return;
        if (confirm("Hapus pesan ini dari database?")) {
            chatRef.child(key).remove();
        }
    }

    function resetAllChats() {
        const isCurrentAdmin = (currentUser.toLowerCase() === ADMIN_USERNAME.toLowerCase());
        if (!isCurrentAdmin) return;

        if (confirm("Hapus SELURUH isi chat dari database?")) {
            chatRef.remove();
        }
    }

    // Listener Keyboard Enter
    document.getElementById('chatInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') sendChatMessage();
    });

    // 4. Realtime Database Listener
    chatRef.on('value', (snapshot) => {
        const chatBox = document.getElementById('chatBox');
        const data = snapshot.val();

        if (!data) {
            chatBox.innerHTML = `
                <div style="text-align: center; color: var(--text-muted); padding: 40px 10px; font-size: 0.85rem;">
                    Belum ada pesan silaturahmi.
                </div>
            `;
            return;
        }

        let htmlContent = '';
        const isCurrentAdmin = (currentUser && currentUser.toLowerCase() === ADMIN_USERNAME.toLowerCase());

        Object.keys(data).forEach(key => {
            const chat = data[key];
            const username = chat.username || 'Anonim';
            const initial = username.charAt(0).toUpperCase();
            const timeInfo = chat.time || '';
            const dateInfo = chat.date || '';
            const safeText = escapeHtml(chat.text || '');

            const isMsgFromAdmin = (username.toLowerCase() === ADMIN_USERNAME.toLowerCase());
            const verifiedBadge = isMsgFromAdmin 
                ? `<i class="fa-solid fa-circle-check" style="color: #1DA1F2; font-size: 0.8rem;" title="Admin"></i>` 
                : '';

            const deleteBtn = isCurrentAdmin 
                ? `<button class="btn-delete-msg" onclick="deleteChatMessage('${key}')"><i class="fa-solid fa-trash"></i></button>` 
                : '';

            htmlContent += `
                <div class="chat-bubble-item">
                    <div class="user-avatar">${initial}</div>
                    <div>
                        <div class="bubble-content">
                            <div class="bubble-username">${escapeHtml(username)} ${verifiedBadge}</div>
                            <div class="bubble-text">${safeText}</div>
                        </div>
                        <div class="bubble-meta">
                            <span><i class="fa-regular fa-clock"></i> ${timeInfo} • ${dateInfo}</span>
                            ${deleteBtn}
                        </div>
                    </div>
                </div>
            `;
        });

        chatBox.innerHTML = htmlContent;
        chatBox.scrollTop = chatBox.scrollHeight;
    });

    // Inisialisasi saat dokumen siap
    document.addEventListener('DOMContentLoaded', initApp);
</script>

</body>
</html>
